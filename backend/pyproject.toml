[project]
name = "codebase-rag-backend"
version = "0.1.0"
description = "Codebase RAG Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[pool]>=3.2.0",
    "pgvector>=0.2.5",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "greenlet>=3.0",
    "sentence-transformers>=3.0.0; extra == 'local-embeddings'",
    "torch>=2.2.0; extra == 'local-embeddings'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[project.optional-dependencies]
dev = [
    "setuptools>=84.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=22.0.0",
    "psycopg[binary]>=3.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]
local-embeddings = []

[project.urls]
Homepage = "https://github.com/example/codebase-rag"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PL", "RUF", "SIM", "TID", "PTH"]
ignore = ["S101", "PTH123"]
fixable = ["F", "I", "N", "W", "UP", "B", "C4", "RUF", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
enable_error_code = ["unused-ignore", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-fail-under=65"
markers = [
    "unit: tests that do not require external services or a database",
    "integration: tests that exercise the API or PostgreSQL-backed application behavior",
    "database: tests that require TEST_DATABASE_URL pointing to an isolated PostgreSQL test database with pgvector",
]

[tool.coverage.run]
omit = ["app/tests/*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
